name: StayFinder verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      - run: npm run build
      - run: npm test
      - run: npm run test:automation
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          path: |
            automation/reports/
            automation/test-results/
          retention-days: 14
